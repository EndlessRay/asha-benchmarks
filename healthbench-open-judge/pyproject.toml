[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "healthbench-open-judge"
version = "0.1.0"
description = "Grade HealthBench with a validated open-weight or low-cost judge"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = ["httpx>=0.25", "numpy>=1.24"]

[project.scripts]
hbjudge = "hbjudge.cli:main"

[tool.setuptools]
packages = ["hbjudge"]
